  <body class="bg-fondo">
    <!--
      Pantalla de carga: el mismo color de fondo que el arranque nativo (#0b1220), sin logo ni texto más que el porcentaje.
      El porcentaje lo mueve `window.__cargaPaso(pct)`, que llama `src/main.tsx` en pasos reales. Llega al 100, o se quita
      como tope a los 6 s desde que carga el HTML: nunca bloquea la app aunque algún paso no termine.
    -->
    <div id="carga" aria-hidden="true" style="position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#0b1220;transition:opacity 250ms ease;">
      <span id="carga-pct" style="font:500 14px/1 system-ui,-apple-system,sans-serif;color:#cbd5e1;font-variant-numeric:tabular-nums;">0%</span>
    </div>
    <script>
      (function () {
        var capa = document.getElementById('carga');
        var texto = document.getElementById('carga-pct');
        var quieto = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var mostrado = 0;
        var meta = 0;
        var reloj = null;
        var cerrada = false;
        if (quieto) capa.style.transition = 'none';

        function pintar() {
          texto.textContent = mostrado + '%';
        }
        function quitar() {
          if (cerrada) return;
          cerrada = true;
          clearInterval(reloj);
          capa.style.opacity = '0';
          setTimeout(function () { capa.remove(); }, quieto ? 0 : 250);
        }
        // El número sube de uno en uno hasta el último paso real: nunca se adelanta a lo que de verdad ha pasado.
        function tic() {
          if (mostrado < meta) {
            mostrado += 1;
            pintar();
          }
          if (mostrado >= 100) return quitar();
          if (mostrado >= meta) {
            clearInterval(reloj);
            reloj = null;
          }
        }
        window.__cargaPaso = function (pct) {
          if (cerrada) return;
          var v = Math.min(100, Math.max(0, Math.round(pct)));
          if (v > meta) meta = v;
          if (quieto) {
            mostrado = meta;
            pintar();
            if (mostrado >= 100) quitar();
            return;
          }
          if (!reloj) reloj = setInterval(tic, 8);
        };
        // Tope de seguridad: pase lo que pase con la app, la pantalla se quita a los 6 s.
        setTimeout(quitar, 6000);
      })();
    </script>
    <div id="root"></div>
  </body>
