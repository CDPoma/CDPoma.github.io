<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cuenta · Account</title>
<style>
  body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#F6FBF4;color:#1F2A1F;display:flex;min-height:100vh;align-items:center;justify-content:center}
  main{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:28px;max-width:380px;width:calc(100% - 32px)}
  h1{font-size:22px;margin:0 0 8px} p{color:#5B6B5B;line-height:1.45;margin:0 0 16px}
  label{display:block;font-weight:600;margin:12px 0 6px}
  input{width:100%;box-sizing:border-box;font-size:17px;padding:12px;border:1px solid #cfd8cf;border-radius:10px}
  button{margin-top:18px;width:100%;font-size:17px;font-weight:600;padding:14px;border:0;border-radius:12px;background:#2E7D32;color:#fff}
  button:disabled{opacity:.5} .ok{color:#2E7D32;font-weight:600} .mal{color:#b3261e}
</style>
</head>
<body>
<main id="caja"><p id="estado">…</p></main>
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const en = !navigator.language.toLowerCase().startsWith('es');
  const T = en ? {
    titulo: 'New password', texto: 'Choose a new password for your account.', campo: 'New password (8+ characters)', repite: 'Repeat it',
    boton: 'Save password', hecho: 'Password changed. Go back to the app and sign in with your new password.',
    distinta: 'The two passwords don’t match.', corta: 'Use at least 8 characters.',
    caducado: 'This link has expired or was already used. Request a new one from the app.', error: 'Something went wrong. Try again.'
  } : {
    titulo: 'Nueva contraseña', texto: 'Elige una contraseña nueva para tu cuenta.', campo: 'Contraseña nueva (8 o más caracteres)', repite: 'Repítela',
    boton: 'Guardar contraseña', hecho: 'Contraseña cambiada. Vuelve a la app y entra con tu contraseña nueva.',
    distinta: 'Las dos contraseñas no coinciden.', corta: 'Usa al menos 8 caracteres.',
    caducado: 'Este enlace ha caducado o ya se usó. Pide otro desde la app.', error: 'Algo ha fallado. Inténtalo de nuevo.'
  };
  document.documentElement.lang = en ? 'en' : 'es';
  const caja = document.getElementById('caja');
  const sb = createClient('https://rvtyzxvkdzpinspvsvxr.supabase.co', 'sb_publishable_DVf9U1R7oPxt-ss2_2PeVg_aK87iFNN',
    { auth: { detectSessionInUrl: true, persistSession: false, flowType: 'implicit' } });
  const hash = new URLSearchParams(location.hash.slice(1));
  function aviso(txt, cls) { caja.innerHTML = `<h1>${T.titulo}</h1><p class="${cls}">${txt}</p>`; }
  function formulario() {
    caja.innerHTML = `<h1>${T.titulo}</h1><p>${T.texto}</p>
      <label for="a">${T.campo}</label><input id="a" type="password" autocomplete="new-password">
      <label for="b">${T.repite}</label><input id="b" type="password" autocomplete="new-password">
      <p id="msg" class="mal" style="margin-top:12px"></p><button id="g">${T.boton}</button>`;
    document.getElementById('g').onclick = async () => {
      const a = document.getElementById('a').value, b = document.getElementById('b').value, msg = document.getElementById('msg');
      if (a.length < 8) { msg.textContent = T.corta; return; }
      if (a !== b) { msg.textContent = T.distinta; return; }
      const btn = document.getElementById('g'); btn.disabled = true;
      const { error } = await sb.auth.updateUser({ password: a });
      if (error) { msg.textContent = T.error; btn.disabled = false; return; }
      await sb.auth.signOut();
      aviso(T.hecho, 'ok');
    };
  }
  if (hash.get('error_code') || hash.get('error')) { aviso(T.caducado, 'mal'); }
  else {
    const { data } = await sb.auth.getSession();
    if (data.session && (hash.get('type') === 'recovery' || hash.get('access_token'))) formulario();
    else aviso(T.caducado, 'mal');
  }
</script>
</body>
</html>
