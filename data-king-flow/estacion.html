<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Estacion Flow</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background-color: #020617;
    color: #f1f5f9;
    font-family: -apple-system, Helvetica, Arial, sans-serif;
  }
  .top {
    display: table;
    width: 100%;
    background-color: rgba(15, 23, 42, 0.9);
    border-bottom: 1px solid #1e293b;
    padding: 12px 20px;
    box-sizing: border-box;
  }
  .top-left {
    display: table-cell;
    vertical-align: middle;
  }
  .top-right {
    display: table-cell;
    vertical-align: middle;
    text-align: right;
  }
  .dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ef4444;
    box-shadow: 0 0 8px #ef4444;
    margin-right: 8px;
    vertical-align: middle;
  }
  .top-titulo {
    font-size: 16px;
    font-weight: 700;
    color: #f8fafc;
    vertical-align: middle;
  }
  .top-sub {
    font-size: 12px;
    color: #64748b;
    margin-top: 2px;
  }
  .actualizado {
    font-size: 12px;
    color: #94a3b8;
  }
  .wrap {
    padding: 16px;
  }
  .grid {
    display: table;
    width: 100%;
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 12px;
    margin: -12px;
  }
  .fila {
    display: table-row;
  }
  .card {
    display: table-cell;
    background-color: rgba(15, 23, 42, 0.7);
    border: 1px solid #1e293b;
    border-radius: 16px;
    padding: 16px;
    vertical-align: top;
    width: 25%;
  }
  .card-head {
    display: table;
    width: 100%;
    margin-bottom: 10px;
  }
  .card-icon {
    display: table-cell;
    width: 32px;
    font-size: 20px;
    vertical-align: middle;
  }
  .card-label {
    display: table-cell;
    font-size: 12px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #94a3b8;
    vertical-align: middle;
  }
  .card-valor {
    font-size: 30px;
    font-weight: 800;
    white-space: nowrap;
  }
  .card-unidad {
    font-size: 14px;
    color: #64748b;
    margin-left: 3px;
    font-weight: 600;
  }
  .subfila {
    margin-top: 8px;
    font-size: 12px;
    color: #94a3b8;
    line-height: 1.5;
  }
  .amber { color: #fbbf24; }
  .emerald { color: #34d399; }
  .sky { color: #38bdf8; }
  .red { color: #f87171; }
  .gris { color: #64748b; }
  .estado-pill {
    display: inline-block;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
  }
  .pill-on { background: rgba(52, 211, 153, 0.15); color: #34d399; }
  .pill-off { background: rgba(100, 116, 139, 0.15); color: #64748b; }
  .error {
    text-align: center;
    color: #f87171;
    padding: 20px;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="top">
  <div class="top-left">
    <span class="dot"></span><span class="top-titulo">En directo desde tu estación</span>
    <div class="top-sub">Data King Flow Monitor</div>
  </div>
  <div class="top-right">
    <div class="actualizado" id="actualizado">Cargando...</div>
  </div>
</div>

<div class="wrap">
  <div class="grid">
    <div class="fila">
      <div class="card">
        <div class="card-head">
          <div class="card-icon">🔋</div>
          <div class="card-label">Batería</div>
        </div>
        <span class="card-valor" id="soc">--</span><span class="card-unidad">%</span>
        <div class="subfila">
          <span id="voltaje">--</span> V &nbsp;&middot;&nbsp;
          <span id="corrienteLabel">Carga</span> <span id="corriente">--</span> A
        </div>
      </div>
      <div class="card">
        <div class="card-head">
          <div class="card-icon">☀️</div>
          <div class="card-label">Solar</div>
        </div>
        <span class="card-valor amber" id="solar">--</span><span class="card-unidad">W</span>
        <div class="subfila">Generación instantánea</div>
      </div>
      <div class="card">
        <div class="card-head">
          <div class="card-icon">🏠</div>
          <div class="card-label">Consumo</div>
        </div>
        <span class="card-valor sky" id="consumo">--</span><span class="card-unidad">W</span>
        <div class="subfila">Potencia de la vivienda</div>
      </div>
      <div class="card">
        <div class="card-head">
          <div class="card-icon">⚡</div>
          <div class="card-label">Red / Generador</div>
        </div>
        <div><span class="estado-pill pill-off" id="red">--</span></div>
        <div class="subfila">&nbsp;</div>
      </div>
    </div>
  </div>

  <div class="error" id="errorBox" style="display:none;"></div>
</div>

<script>
(function () {
  var PROJECT_ID = 'tu-lista-8f52a';
  var CODIGO = 'ESTFLW';
  var URL = 'https://firestore.googleapis.com/v1/projects/' + PROJECT_ID + '/databases/(default)/documents/puentes_flow/' + CODIGO;
  var PRESENCIA_URL = 'https://firestore.googleapis.com/v1/projects/' + PROJECT_ID + '/databases/(default)/documents/puentes_flow_viewers/' + CODIGO + '?updateMask.fieldPaths=ultimaVista';
  var REFRESCO_MS = 10000;

  // Avisa a la estación de que hay alguien mirando (igual que hace la app en modo remoto) — sin
  // esto, la estación no publica nada nuevo y esta pantalla se queda con el último dato de cuando
  // alguien tuvo la app abierta.
  function avisarPresencia() {
    var xhr = new XMLHttpRequest();
    xhr.open('PATCH', PRESENCIA_URL, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.send(JSON.stringify({ fields: { ultimaVista: { integerValue: String(Date.now()) } } }));
  }

  function getField(fields, name) {
    if (!fields || !fields[name]) return null;
    var f = fields[name];
    if (f.doubleValue !== undefined) return parseFloat(f.doubleValue);
    if (f.integerValue !== undefined) return parseInt(f.integerValue, 10);
    if (f.stringValue !== undefined) return f.stringValue;
    if (f.nullValue !== undefined) return null;
    return null;
  }

  function setText(id, text) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = text;
  }

  function setClass(id, className) {
    var el = document.getElementById(id);
    if (el) el.className = className;
  }

  function segundosDesde(ms) {
    var s = Math.round((Date.now() - ms) / 1000);
    if (s < 60) return 'hace ' + s + 's';
    var m = Math.round(s / 60);
    if (m < 60) return 'hace ' + m + ' min';
    var h = Math.round(m / 60);
    return 'hace ' + h + ' h';
  }

  function colorSoc(percent) {
    if (percent >= 80) return 'card-valor emerald';
    if (percent >= 60) return 'card-valor amber';
    return 'card-valor red';
  }

  function pintar(doc) {
    var fields = doc.fields || {};
    var actualizadoEn = getField(fields, 'actualizadoEn');
    var latestSample = fields.latestSample && fields.latestSample.mapValue ? fields.latestSample.mapValue.fields : null;

    if (actualizadoEn) {
      setText('actualizado', 'Actualizado ' + segundosDesde(actualizadoEn));
    }

    if (!latestSample) {
      setText('errorBox', 'Todavia no hay datos publicados por la estacion.');
      document.getElementById('errorBox').style.display = 'block';
      return;
    }
    document.getElementById('errorBox').style.display = 'none';

    var soc = getField(latestSample, 'batteryCapacity');
    var voltaje = getField(latestSample, 'batteryVoltage');
    var cargaA = getField(latestSample, 'batteryChargingCurrent');
    var descargaA = getField(latestSample, 'batteryDischargeCurrent');
    var solar = getField(latestSample, 'pvChargingPower');
    var consumo = getField(latestSample, 'acOutputActivePower');
    var gridVoltage = getField(latestSample, 'gridVoltage');

    setText('soc', soc !== null ? Math.round(soc) : '--');
    setClass('soc', soc !== null ? colorSoc(soc) : 'card-valor');
    setText('voltaje', voltaje !== null ? voltaje.toFixed(1) : '--');
    setText('solar', solar !== null ? Math.round(solar) : '--');
    setText('consumo', consumo !== null ? Math.round(consumo) : '--');

    if (descargaA !== null && descargaA > 0.5) {
      setText('corrienteLabel', 'Descarga');
      setText('corriente', descargaA.toFixed(1));
    } else {
      setText('corrienteLabel', 'Carga');
      setText('corriente', cargaA !== null ? cargaA.toFixed(1) : '--');
    }

    if (gridVoltage !== null && gridVoltage > 30) {
      setText('red', 'ENCENDIDO &middot; ' + gridVoltage.toFixed(0) + ' V');
      setClass('red', 'estado-pill pill-on');
    } else {
      setText('red', 'APAGADO');
      setClass('red', 'estado-pill pill-off');
    }
  }

  function cargar() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', URL + '?_=' + Date.now(), true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status === 200) {
        try {
          var doc = JSON.parse(xhr.responseText);
          pintar(doc);
        } catch (e) {
          setText('errorBox', 'Error leyendo los datos.');
          document.getElementById('errorBox').style.display = 'block';
        }
      } else {
        setText('errorBox', 'No se pudo conectar (codigo ' + xhr.status + ').');
        document.getElementById('errorBox').style.display = 'block';
      }
    };
    xhr.send();
  }

  function ciclo() {
    avisarPresencia();
    cargar();
  }

  ciclo();
  setInterval(ciclo, REFRESCO_MS);
})();
</script>
</body>
</html>
